    <!-- Anti-encadrement (audit du 21/11/2026) : GitHub Pages n'envoie aucun en-tête, et
         `frame-ancestors` ne vaut pas dans une balise meta. Encadrée par une page d'une AUTRE
         origine (« clickjacking » : faire toucher à l'aveugle), l'appli ne s'affiche pas et tente
         de prendre toute la fenêtre. Un cadre de la même origine reste permis : la fabrique de
         vidéos (marketing/outils/scene.html) filme l'appli dans un iframe. -->
    <script>
      (function () {
        if (window.top === window.self) return;
        var meme = false;
        try { meme = window.top.location.origin === location.origin; } catch (e) { /* autre origine */ }
        if (meme) return;
        document.documentElement.style.display = 'none';
        try { window.top.location.replace(location.href); } catch (e) { /* navigateur qui refuse */ }
      })();
    </script>
    <!-- Le thème est posé AVANT le premier rendu : appliqué seulement au chargement de

      } catch (e) {}
      // L'icône choisie dans Profil → Apparence (icone-appli.js) : celle que Safari prend quand
      // on AJOUTE le site à l'écran d'accueil.
      try {
        var ic = JSON.parse(localStorage.getItem('pcbox.prefs') || '{}').icone;
        if (ic === 'nuit' || ic === 'rouge') {
          document.querySelector('link[rel=apple-touch-icon]').setAttribute('href', 'icones/' + ic + '-180.png');
          document.querySelector('link[rel=icon]').setAttribute('href', 'icones/' + ic + '.svg');

  <body>
    <!-- L'ÉCRAN DE LANCEMENT. Il est ICI, dans la page, et non dans main.js : il paraît dès la
         première image, pendant que le code de l'appli (plusieurs Mo, Pokédex compris) se
         charge et s'analyse — sur iPhone, c'était un écran vide.
         REFAIT le 21/11/2026, à la demande : « d'après le nouveau logo, le Y bicolore divisé en
         deux, une animation moderne et minimaliste, l'ADN du Pokédex, les couleurs, les
         cartes ; le logo en grand qui se déploie d'un coup, avec marqué Unydex ».
         1. l'icône de l'appli s'ouvre au centre (aux couleurs de l'icône choisie au Profil) ;
         2. le Y se déploie depuis son pied, puis la raie sort de derrière lui, parallèle ;
         3. les quatre coins du viseur se referment autour, deux cartes s'ouvrent en éventail
            derrière l'icône, « Unydex » monte lettre à lettre (le y en rouge), la devise suit ;
         4. pendant le chargement, une ligne de scan balaie l'icône, la barre se remplit, les
            messages défilent (main.js pilote `window.__lancement`) ;
         5. PRÊT : une demi-seconde de plus pour lire, puis tout s'efface et l'écran part.
         Tout est en CSS, à plat (pas de dégradé ni d'ombre colorée) ; mouvement réduit : un
         simple fondu. -->
    <style>
      @font-face {
        font-family: "UrbanistLanc"; font-weight: 100 900; font-display: swap;
        src: url("fonts/urbanist-latin.woff2") format("woff2");
      }
      #lancement {
        --lc-fond: #f6f5f1; --lc-encre: #1d2330; --lc-doux: #606977; --lc-rouge: #d03f36;
        --lc-piste: rgb(29 35 48 / 10%); --lc-filet: #e3e0d6; --lc-carte: #ffffff;
        /* L'icône (papier par défaut ; nuit, rouge : data-icone, posé par le script). */
        --t-fond: #ffffff; --t-y: #d03f36; --t-raie: #131a2b; --t-coins: #c9ced6;
        --p: 0; --tuile: 148px;
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center; align-content: center; gap: 0;
        padding: var(--safe-area-inset-top, env(safe-area-inset-top)) 24px var(--safe-area-inset-bottom, env(safe-area-inset-bottom));
        background: var(--lc-fond);
        color: var(--lc-encre);
        font-family: UrbanistLanc, Urbanist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
        transition: opacity 320ms ease;
        -webkit-user-select: none; user-select: none;
      }
      [data-theme="sombre"] #lancement {
        --lc-fond: #080b13; --lc-encre: #f1f3f8; --lc-doux: #9aa4b5; --lc-rouge: #f0524a;
        --lc-piste: rgb(255 255 255 / 10%); --lc-filet: #2a3346; --lc-carte: #131a2b;
        --t-fond: #131a2b; --t-y: #f0524a; --t-raie: #f6f5f1; --t-coins: #3a4560;
      }
      #lancement[data-icone="nuit"] { --t-fond: #080b13; --t-y: #f0524a; --t-raie: #f6f5f1; --t-coins: #3a4560; }
      #lancement[data-icone="rouge"] { --t-fond: #d03f36; --t-y: #ffffff; --t-raie: #131a2b; --t-coins: #e48a83; }
      #lancement.part { opacity: 0; pointer-events: none; }

      /* La scène : l'icône au centre, deux cartes derrière, les coins du viseur autour. */
      .lanc-scene { position: relative; width: 300px; height: 210px; display: grid; place-items: center; }
      .lanc-carte {
        position: absolute; left: 50%; top: 50%; width: 92px; height: 128px; margin: -64px 0 0 -46px;
        border-radius: 9px; background: var(--lc-carte); box-shadow: 0 0 0 1px var(--lc-filet), 0 6px 18px rgb(0 0 0 / 8%);
        animation: lancCarte 560ms cubic-bezier(.2,.9,.25,1.15) 620ms both;
      }
      .lanc-carte.g { --sens: -1; --c: var(--lc-rouge); }
      .lanc-carte.d { --sens: 1; --c: var(--lc-encre); }
      /* Le dessin d'une carte : la fenêtre d'illustration, deux lignes de texte. */
      .lanc-carte::before { content: ''; position: absolute; left: 9px; right: 9px; top: 9px; height: 62px; border-radius: 4px; background: var(--c); opacity: .16; }
      .lanc-carte::after {
        content: ''; position: absolute; left: 11px; bottom: 30px; width: 52px; height: 4px; border-radius: 2px; background: var(--c); opacity: .3;
        box-shadow: 0 10px 0 0 var(--c);
      }
      @keyframes lancCarte {
        from { opacity: 0; transform: translateX(0) rotate(0) scale(.9); }
        to { opacity: 1; transform: translateX(calc(var(--sens) * 62px)) translateY(6px) rotate(calc(var(--sens) * 13deg)); }
      }

      /* L'icône de l'appli, en grand. */
      .lanc-tuile {
        position: relative; width: var(--tuile); height: var(--tuile); border-radius: 22.37%;
        background: var(--t-fond); box-shadow: 0 0 0 1px var(--lc-filet), 0 14px 34px rgb(0 0 0 / 12%);
        overflow: hidden;
        animation: lancTuile 560ms cubic-bezier(.2,.9,.25,1.2) both;
      }
      @keyframes lancTuile { from { opacity: 0; transform: scale(.45); } }
      .lanc-tuile svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* Le Y se déploie depuis son pied ; la raie sort de derrière lui, parallèle à son bras. */
      .lanc-y { transform-box: fill-box; transform-origin: 50% 100%; animation: lancY 520ms cubic-bezier(.2,.9,.25,1.25) 170ms both; }
      @keyframes lancY { from { transform: scaleY(0); } 60% { transform: scaleY(1.06); } to { transform: scaleY(1); } }
      .lanc-raie { animation: lancRaie 460ms cubic-bezier(.2,.9,.25,1.3) 560ms both; }
      @keyframes lancRaie { from { transform: translate(-66px, -40px); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
      /* La ligne de scan qui balaie l'icône pendant le chargement. */
      .lanc-scan {
        position: absolute; left: 22%; right: 22%; top: 24%; height: 2px; border-radius: 1px;
        background: var(--lc-rouge); opacity: 0;
        animation: lancScan 1.7s cubic-bezier(.45,0,.55,1) 1150ms infinite alternate;
      }
      [data-icone="rouge"] .lanc-scan { background: #fff; }
      @keyframes lancScan { 0% { opacity: .45; transform: translateY(0); } 100% { opacity: .45; transform: translateY(calc(var(--tuile) * .5)); } }

      /* Les coins du viseur, ceux du logo : centrés sur l'icône (16,4 % de son bord).
         `--x` / `--y` : leur distance au centre de l'icône. */
      .lanc-coin {
        --x: calc(var(--tuile) * .336); --y: var(--x);
        position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px;
        border: 0 solid var(--t-coins);
        transform: translate(calc(var(--sx) * var(--x)), calc(var(--sy) * var(--y)));
        z-index: 2;
        animation: lancCoin 420ms cubic-bezier(.2,.9,.25,1.2) 300ms both;
      }
      .lanc-coin.hg { --sx: -1; --sy: -1; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 6px; }
      .lanc-coin.hd { --sx: 1; --sy: -1; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 6px; }
      .lanc-coin.bg { --sx: -1; --sy: 1; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 6px; }
      .lanc-coin.bd { --sx: 1; --sy: 1; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 6px; }
      @keyframes lancCoin {
        from { opacity: 0; transform: translate(calc(var(--sx) * (var(--x) + 26px)), calc(var(--sy) * (var(--y) + 26px))); }
      }

      /* Le nom, lettre à lettre ; le y en rouge, comme celui du logo. */
      .lanc-nom { margin: 18px 0 0; display: flex; font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -0.035em; }
      .lanc-nom span { display: inline-block; animation: lancLettre 440ms cubic-bezier(.2,.9,.25,1.15) both; animation-delay: calc(700ms + var(--i) * 45ms); }
      .lanc-nom .y { color: var(--lc-rouge); }
      @keyframes lancLettre { from { opacity: 0; transform: translateY(16px); } }
      .lanc-devise {
        margin: 10px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--lc-doux);
        animation: lancFondu 400ms ease 1000ms both;
      }
      .lanc-bas { display: grid; justify-items: center; gap: 6px; margin-top: 26px; animation: lancFondu 400ms ease 1100ms both; }
      @keyframes lancFondu { from { opacity: 0; transform: translateY(6px); } }
      .lanc-barre { width: 128px; height: 3px; border-radius: 99px; background: var(--lc-piste); overflow: hidden; }
      .lanc-barre i { display: block; height: 100%; width: calc(var(--p) * 1%); border-radius: inherit; background: var(--lc-rouge); transition: width 300ms ease; }
      .lanc-etape { margin: 6px 0 0; min-height: 18px; font-size: 13px; font-weight: 600; color: var(--lc-doux); text-align: center; }
      .lanc-etape.change { animation: lancMot 320ms ease both; }
      @keyframes lancMot { from { opacity: 0; transform: translateY(4px); } }
      /* Le vrai travail en cours, en petit : séries, logos, cartes classées. */
      .lanc-detail { margin: 0; min-height: 15px; font-size: 11px; font-weight: 600; color: var(--lc-doux); opacity: .7; font-variant-numeric: tabular-nums; text-align: center; }
      .lanc-passer {
        margin-top: 14px; padding: 10px 22px; border-radius: 99px; border: 1px solid var(--lc-filet);
        background: transparent; color: var(--lc-encre); font: inherit; font-weight: 700; font-size: 15px;
        opacity: 0; transform: translateY(6px); transition: opacity 300ms ease, transform 300ms ease;
      }
      .lanc-passer.vu { opacity: 1; transform: none; }

      /* PRÊT : tout s'efface ensemble, viseur compris (son ouverture jusqu'aux coins de
         l'écran a été retirée le 21/11/2026, à la demande), puis l'écran part en fondu. */
      .lanc-contenu { display: grid; justify-items: center; transition: opacity 280ms ease, transform 380ms cubic-bezier(.6,0,.4,1); }
      #lancement.fin .lanc-contenu { opacity: 0; transform: scale(.96); }

      @media (prefers-reduced-motion: reduce) {
        #lancement *, #lancement *::before, #lancement *::after { animation: none !important; transition: none !important; }
      }
      [data-mouvement="reduit"] #lancement *, [data-mouvement="reduit"] #lancement *::before, [data-mouvement="reduit"] #lancement *::after { animation: none !important; transition: none !important; }
    </style>
    <div id="lancement" aria-busy="true">
      <div class="lanc-contenu">
        <div class="lanc-scene" aria-hidden="true">
          <i class="lanc-carte g"></i><i class="lanc-carte d"></i>
          <div class="lanc-tuile">
            <svg viewBox="0 0 1024 1024">
              <path class="lanc-raie" fill="var(--t-raie)" d="M705.02 296H761L604 557.67V728H556V544.37Z"/>
              <path class="lanc-y" fill="var(--t-y)" d="M263.63 296H403.57L468 403.38L532.43 296H672.37L528 536.62V728H408V536.62Z"/>
            </svg>
            <i class="lanc-scan"></i>
          </div>
          <i class="lanc-coin hg"></i><i class="lanc-coin hd"></i><i class="lanc-coin bg"></i><i class="lanc-coin bd"></i>
        </div>
        <h1 class="lanc-nom" aria-label="Unydex"><span style="--i:0">U</span><span style="--i:1">n</span><span class="y" style="--i:2">y</span><span style="--i:3">d</span><span style="--i:4">e</span><span style="--i:5">x</span></h1>
        <p class="lanc-devise" aria-hidden="true"></p>
        <div class="lanc-bas">
          <div class="lanc-barre" aria-hidden="true"><i></i></div>
          <p class="lanc-etape" role="status" aria-live="polite"></p>
          <p class="lanc-detail" aria-hidden="true"></p>
          <button class="lanc-passer" type="button" hidden></button>
        </div>
      </div>
    </div>
    <script>
      // Pilote de l'écran : main.js appelle detail(), progres() et fin(). Sans lui (code qui ne
      // se charge pas), « Continuer » paraît au bout de 4 s : on n'est jamais coincé.
      // Les MESSAGES défilent d'eux-mêmes (un chargement qui se raconte, demandé le
      // 10/11/2026) ; la ligne de détail dit, elle, le vrai travail (main.js).
      (function () {
        var el = document.getElementById('lancement');
        if (!el) return;
        var t0 = performance.now();
        var lg = 'fr';
        try { lg = localStorage.getItem('pcbox.langue') || (navigator.language || 'fr').slice(0, 2); } catch (e) {}
        // L'icône choisie au Profil (Apparence) : l'écran prend ses couleurs.
        try {
          var ic = JSON.parse(localStorage.getItem('pcbox.prefs') || '{}').icone;
          if (ic === 'nuit' || ic === 'rouge') el.dataset.icone = ic;
        } catch (e) {}
        var TEXTES = {
          fr: { passer: 'Continuer', devise: 'Pokédex · Cartes · Scan', messages: ['Ouverture du Pokédex…', 'Réveil des Pokémon…', 'Mélange des boosters…',
            'Polissage des cartes holographiques…', 'Tri des raretés…', 'Calibrage du viseur…', 'Classement des extensions par bloc…',
            'Vérification des reverses…', 'Comptage des Poké Balls…', 'Lustrage des Master Balls…', 'Rangement des classeurs…',
            'Synchronisation des boîtes PC…', 'Repérage des cartes rares…', 'Dépoussiérage des promos…', 'Alignement des logos…'] },
          en: { passer: 'Continue', devise: 'Pokédex · Cards · Scan', messages: ['Opening the Pokédex…', 'Waking up the Pokémon…', 'Shuffling booster packs…',
            'Polishing holo cards…', 'Sorting rarities…', 'Calibrating the viewfinder…', 'Grouping sets by era…',
            'Checking reverse holos…', 'Counting Poké Balls…', 'Buffing Master Balls…', 'Tidying up binders…',
            'Syncing PC boxes…', 'Spotting rare cards…', 'Dusting off promos…', 'Lining up set logos…'] },
          ja: { passer: 'つづける', devise: 'ずかん · カード · スキャン', messages: ['ずかんを ひらいています…', 'ポケモンを おこしています…', 'パックを まぜています…',
            'ホロカードを みがいています…', 'レアリティを ならべています…', 'ファインダーを ちょうせい中…', 'シリーズを せいり中…',
            'リバースを たしかめています…', 'モンスターボールを かぞえています…', 'マスターボールを みがいています…', 'バインダーを せいり中…',
            'パソコンの ボックスを どうき中…', 'レアカードを さがしています…', 'プロモカードを ととのえています…', 'ロゴを ならべています…'] },
        };
        var T = TEXTES[lg] || TEXTES.fr;
        // Ce que l'écran a montré (messages, détails), relu pour le vérifier.
        var journal = window.__lancementJournal = [];
        var note = function (x) { if (journal.length < 400) journal.push(Math.round(performance.now()) + ' ' + x); };
        var etape = el.querySelector('.lanc-etape'), detail = el.querySelector('.lanc-detail'), passer = el.querySelector('.lanc-passer');
        passer.textContent = T.passer;
        el.querySelector('.lanc-devise').textContent = T.devise;
        var fini = false;
        var reduit = matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.mouvement === 'reduit';

        // Les messages : le premier, puis les autres dans un ordre tiré au hasard.
        function dit(txt) {
          etape.textContent = txt;
          note('« ' + txt + ' »');
          etape.classList.remove('change');
          void etape.offsetWidth;
          etape.classList.add('change');
        }
        var suite = T.messages.slice(1).sort(function () { return Math.random() - 0.5; });
        var rang = 0;
        dit(T.messages[0]);
        var minuteurMots = setInterval(function () { if (!fini) dit(suite[rang++ % suite.length]); }, 700);

        function retire() { if (el.parentNode) el.parentNode.removeChild(el); }
        function part() {
          el.classList.add('part');
          note('écran parti');
          el.setAttribute('aria-busy', 'false');
          setTimeout(retire, 360);
        }
        // La pub d'ouverture (pubs.js, branchée par main.js sur `avantDepart`) se pose SUR
        // l'écran, qui ne part qu'à sa fermeture : Google la veut sur l'écran de chargement,
        // pas sur l'appli. Sans pub, l'écran part aussitôt.
        function avantDepart(suite) {
          var f = api.avantDepart;
          if (typeof f !== 'function') return suite();
          note('pub d’ouverture ?');
          var p;
          try { p = f(); } catch (e) { return suite(); }
          Promise.resolve(p).then(function (vue) { note(vue ? 'pub fermée' : 'pas de pub'); suite(); }, suite);
        }
        var api = {
          detail: function (txt) { if (!fini && txt !== detail.textContent) { detail.textContent = txt || ''; note('· ' + txt); } },
          etape: function (txt) { api.detail(txt); },
          progres: function (p) { el.style.setProperty('--p', Math.max(0, Math.min(100, Math.round(p * 100)))); },
          // `vite` : on saute l'ouverture du viseur (« Continuer »).
          fin: function (txt, vite) {
            if (fini) return;
            fini = true;
            clearInterval(minuteurMots);
            api.progres(1);
            if (txt) dit(txt);
            detail.textContent = '';
            if (vite) { part(); return; }
            if (reduit) { avantDepart(part); return; }
            // Le logo s'est déployé en entier (≈ 1,1 s), PUIS une demi-seconde de plus pour
            // lire « Unydex » et ce qui est dessous (21/11/2026, à la demande).
            var attente = Math.max(0, 1250 - (performance.now() - t0)) + 500;
            setTimeout(function () {
              el.classList.add('fin');
              note('fondu');
              setTimeout(function () { avantDepart(part); }, 300);
            }, attente);
          },
          montreContinuer: function () {
            if (fini) return;
            passer.hidden = false;
            requestAnimationFrame(function () { passer.classList.add('vu'); });
          },
        };
        passer.addEventListener('click', function () { api.fin(null, true); });
        setTimeout(api.montreContinuer, 4000);
        window.__lancement = api;
      })();
    </script>
    <div id="app"></div>
